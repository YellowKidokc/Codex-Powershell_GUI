[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-command-center"
version = "1.0.0"
description = "Personal Scientific OS - Data Command Center"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

dependencies = [
    "customtkinter>=5.2.0",
    "psycopg2-binary>=2.9.9",
    "pyyaml>=6.0",
    "keyring>=24.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "httpx>=0.25.0",  # For Cloudflare D1 API calls
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
dcc = "app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
